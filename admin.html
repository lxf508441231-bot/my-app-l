<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方商城 - 管理员独立控制台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LeanCloud SDK -->
    <script src="//cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex items-center justify-center font-sans">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-5 space-y-6">
        <div class="flex items-center justify-between border-b pb-4">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🛡️</span>
                <span class="font-bold text-base text-gray-800">管理员独立控制台</span>
            </div>
            <span class="text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded-full font-bold">Secure Admin</span>
        </div>

        <!-- 1. 修改指定用户余额 -->
        <div class="space-y-3">
            <label class="text-xs font-bold text-gray-700 block">1. 修改指定用户余额 (USDT)</label>
            <input type="text" id="adminTargetUser" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500 font-mono" placeholder="输入用户的 Telegram UID">
            <div class="flex gap-2">
                <input type="number" id="adminTargetBalance" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="新余额数字">
                <button type="button" onclick="saveTargetUserBalance()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl text-xs font-bold transition active:scale-95 shadow">确认修改</button>
            </div>
        </div>

        <!-- 2. 全网充值申请审核 -->
        <div class="space-y-3 pt-3 border-t">
            <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-gray-700">2. 全网用户充值申请审核</label>
                <button onclick="loadGlobalAdminAuditList()" class="text-xs text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg font-medium hover:bg-blue-100 transition">
                    <i class="fa-solid fa-rotate"></i> 刷新列表
                </button>
            </div>
            <div id="adminDepositAuditList" class="space-y-2.5 max-h-80 overflow-y-auto">
                <div class="text-center py-6 text-xs text-gray-400">正在从云端加载申请记录...</div>
            </div>
        </div>
    </div>

    <script>
        AV.init({
            appId: "9q6K9mU8x1J2L3Z4v5B6n7M8",
            appKey: "testKeyForDemoOnly999",
            serverURLs: "https://leancloud.cn"
        });

        window.onload = function() {
            loadGlobalAdminAuditList();
        };

        async function saveTargetUserBalance() {
            const targetUid = document.getElementById('adminTargetUser').value.trim();
            const newBal = parseFloat(document.getElementById('adminTargetBalance').value);
            if (!targetUid || isNaN(newBal)) {
                alert("请输入完整的目标用户UID和新余额数字！");
                return;
            }

            try {
                const query = new AV.Query('UserWallet');
                query.equalTo('tgUid', targetUid);
                let record = await query.first();
                if (!record) {
                    const Wallet = AV.Object.extend('UserWallet');
                    record = new Wallet();
                    record.set('tgUid', targetUid);
                }
                record.set('balance', newBal);
                await record.save();
                alert(`成功将用户 [${targetUid}] 的余额修改为 ${newBal.toFixed(2)} USDT！`);
            } catch (e) {
                alert("云端更新失败：" + e.message);
            }
        }

        async function loadGlobalAdminAuditList() {
            const container = document.getElementById('adminDepositAuditList');
            container.innerHTML = `<div class="text-xs text-gray-400 py-4 text-center">正在从云端加载全网申请...</div>`;
            try {
                const query = new AV.Query('DepositOrder');
                query.equalTo('status', 'pending');
                query.descending('createdAt');
                const results = await query.find();

                if (results.length === 0) {
                    container.innerHTML = `<div class="text-xs text-gray-400 py-6 text-center">当前没有待审核的充值申请</div>`;
                    return;
                }

                container.innerHTML = results.map(item => `
                    <div class="p-3 bg-gray-50 rounded-xl text-xs space-y-2 border">
                        <div class="flex justify-between font-bold text-gray-700">
                            <span>用户UID: ${item.get('tgUid')}</span>
                            <span class="text-blue-600">${item.get('amount')} USDT</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="adminApprove('${item.id}', '${item.get('tgUid')}', ${item.get('amount')})" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-xs font-bold transition">确认到账并加余额</button>
                            <button onclick="adminReject('${item.id}')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-xs font-bold transition">拒绝/未到</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center py-4">加载失败</div>`;
            }
        }

        async function adminApprove(orderId, targetUid, amount) {
            try {
                const order = AV.Object.createWithoutData('DepositOrder', orderId);
                order.set('status', 'success');
                await order.save();

                const query = new AV.Query('UserWallet');
                query.equalTo('tgUid', targetUid);
                let record = await query.first();
                let current = record ? (record.get('balance') || 0) : 0;
                
                if (!record) {
                    const Wallet = AV.Object.extend('UserWallet');
                    record = new Wallet();
                    record.set('tgUid', targetUid);
                }
                record.set('balance', current + amount);
                await record.save();

                alert(`已为用户 [${targetUid}] 成功入账 ${amount} USDT！`);
                loadGlobalAdminAuditList();
            } catch (e) {
                alert("操作失败：" + e.message);
            }
        }

        async function adminReject(orderId) {
            try {
                const order = AV.Object.createWithoutData('DepositOrder', orderId);
                order.set('status', 'failed');
                await order.save();
                alert("已标记拒绝");
                loadGlobalAdminAuditList();
            } catch (e) {
                alert("操作失败：" + e.message);
            }
        }
    </script>
</body>
</html>
