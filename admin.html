<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方商城 - 管理员独立控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-5 space-y-6">
        <div class="flex items-center justify-between border-b pb-4">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🛡️</span>
                <span class="font-bold text-base text-gray-800">管理员独立控制台</span>
            </div>
            <span class="text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded-full font-bold">Secure Admin</span>
        </div>

        <!-- 1. 修改指定用户余额 -->
        <div class="space-y-3">
            <label class="text-xs font-bold text-gray-700 block">1. 修改指定用户余额 (USDT)</label>
            <input type="text" id="adminTargetUser" class="w-full bg-gray-50 border rounded-xl p-3 text-xs font-mono" placeholder="输入用户的 Telegram UID">
            <div class="flex gap-2">
                <input type="number" id="adminTargetBalance" class="flex-1 bg-gray-50 border rounded-xl p-3 text-sm font-bold" placeholder="新余额数字">
                <button type="button" onclick="saveTargetUserBalance()" class="bg-blue-600 text-white px-5 py-3 rounded-xl text-xs font-bold">确认修改</button>
            </div>
        </div>

        <!-- 2. 全网充值与兑换订单审核 -->
        <div class="space-y-3 pt-3 border-t">
            <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-gray-700">2. 全网用户充值申请审核</label>
                <button onclick="loadAdminAuditList()" class="text-xs text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">
                    <i class="fa-solid fa-rotate"></i> 刷新列表
                </button>
            </div>
            <div id="adminDepositAuditList" class="space-y-2.5 max-h-80 overflow-y-auto">
                <div class="text-center py-6 text-xs text-gray-400">正在加载全网订单...</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadAdminAuditList();
            // 每隔 5 秒自动刷新一次，实现全网实时监控
            setInterval(loadAdminAuditList, 5000);
        };

        function loadAdminAuditList() {
            const container = document.getElementById('adminDepositAuditList');
            let orders = JSON.parse(localStorage.getItem('global_network_orders')) || [];
            let pending = orders.filter(o => o.status === 'pending' && o.type === 'deposit');

            if (pending.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 text-center py-4">当前没有待审核订单</div>`;
                return;
            }

            container.innerHTML = pending.map((item) => `
                <div class="p-3 bg-gray-50 rounded-xl text-xs space-y-2 border">
                    <div class="flex justify-between font-bold text-gray-700">
                        <span>UID: ${item.uid}</span>
                        <span class="text-blue-600">${item.amount} USDT</span>
                    </div>
                    <div class="text-[10px] text-gray-400">时间: ${item.time}</div>
                    <div class="flex gap-2 pt-1">
                        <button onclick="approveOrder('${item.id}', '${item.uid}', ${item.amount})" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-xs font-bold">通过并加余额</button>
                        <button onclick="rejectOrder('${item.id}')" class="flex-1 bg-red-600 text-white py-2 rounded-lg text-xs font-bold">拒绝</button>
                    </div>
                </div>
            `).join('');
        }

        function approveOrder(orderId, uid, amount) {
            let orders = JSON.parse(localStorage.getItem('global_network_orders')) || [];
            orders = orders.map(o => { if(o.id === orderId) o.status = 'success'; return o; });
            localStorage.setItem('global_network_orders', JSON.stringify(orders));

            let currentBal = parseFloat(localStorage.getItem('balance_' + uid)) || 0;
            localStorage.setItem('balance_' + uid, currentBal + amount);

            alert(`已成功为用户 [${uid}] 增加 ${amount} USDT！`);
            loadAdminAuditList();
        }

        function rejectOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('global_network_orders')) || [];
            orders = orders.map(o => { if(o.id === orderId) o.status = 'rejected'; return o; });
            localStorage.setItem('global_network_orders', JSON.stringify(orders));
            loadAdminAuditList();
        }

        function saveTargetUserBalance() {
            const uid = document.getElementById('adminTargetUser'].value.trim();
            const bal = parseFloat(document.getElementById('adminTargetBalance').value);
            if (!uid || isNaN(bal)) { alert("请输入正确的UID和金额"); return; }
            localStorage.setItem('balance_' + uid, bal);
            alert(`已成功将用户 [${uid}] 余额修改为 ${bal} USDT`);
        }
    </script>
</body>
</html>
