<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方商城 - 管理员独立控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex items-center justify-center font-sans">
    <div class="max-w-xl w-full bg-white rounded-2xl shadow-lg p-6 space-y-6">
        <div class="flex items-center justify-between border-b pb-4">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🛡️</span>
                <span class="font-bold text-base text-gray-800">管理员独立控制台</span>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="openAllHistoryModal()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-bold transition">
                    📁 查看所有历史记录
                </button>
                <span class="text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded-full font-bold">Secure Admin</span>
            </div>
        </div>

        <!-- 1. 修改指定用户余额 (支持快速定位搜索) -->
        <div class="space-y-3">
            <label class="text-xs font-bold text-gray-700 block">1. 修改指定用户余额 (USDT)</label>
            <div class="flex gap-2">
                <input type="text" id="adminTargetUser" class="flex-1 bg-gray-50 border rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-blue-500" placeholder="输入用户的 Telegram UID">
                <button type="button" onclick="searchUserBalance()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-3 rounded-xl text-xs font-bold transition">查询余额</button>
            </div>
            <div class="flex gap-2">
                <input type="number" id="adminTargetBalance" class="flex-1 bg-gray-50 border rounded-xl p-3 text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="新余额数字">
                <button type="button" onclick="saveTargetUserBalance()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl text-xs font-bold transition">确认修改</button>
            </div>
        </div>

        <!-- 2. 全网充值与兑换订单审核 (附带按 UID/IP 搜索栏) -->
        <div class="space-y-3 pt-3 border-t">
            <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-gray-700">2. 全网用户充值与兑换订单审核 <span id="pendingCount" class="text-red-500 font-bold"></span></label>
                <div class="flex gap-2">
                    <button type="button" onclick="loadAdminOrders()" class="text-xs text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-medium transition">🔄 刷新列表</button>
                </div>
            </div>
            
            <!-- 搜索过滤输入框 -->
            <div>
                <input type="text" id="searchKeyword" oninput="loadAdminOrders()" placeholder="🔍 输入 UID、
