<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方商城 - 管理员独立控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-5 space-y-6">
        <div class="flex items-center justify-between border-b pb-4">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🛡️</span>
                <span class="font-bold text-base text-gray-800">管理员独立控制台</span>
            </div>
            <span class="text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded-full font-bold">Secure Admin</span>
        </div>

        <!-- 1. 修改指定用户余额 -->
        <div class="space-y-3">
            <label class="text-xs font-bold text-gray-700 block">1. 修改指定用户余额 (USDT)</label>
            <input type="text" id="adminTargetUser" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-blue-500" placeholder="输入用户的 Telegram UID">
            <div class="flex gap-2">
                <input type="number" id="adminTargetBalance" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="新余额数字">
                <button type="button" onclick="saveTargetUserBalance()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl text-xs font-bold transition active:scale-95 shadow">确认修改</button>
            </div>
        </div>

        <!-- 2. 全网用户充值申请审核 -->
        <div class="space-y-3 pt-3 border-t">
            <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-gray-700">2. 全网用户充值申请审核 <span id="pendingCount" class="text-red-500 font-bold"></span></label>
                <div class="flex gap-2">
                    <button type="button" onclick="addTestOrder()" class="text-xs text-green-600 bg-green-50 hover:bg-green-100 px-2.5 py-1.5 rounded-lg font-medium transition">+ 模拟测试</button>
                    <button type="button" onclick="loadAdminAuditList()" class="text-xs text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-medium transition">🔄 刷新</button>
                </div>
            </div>
            <div id="adminDepositAuditList" class="space-y-2.5 max-h-80 overflow-y-auto">
                <div class="text-center py-6 text-xs text-gray-400">正在实时同步全网充值订单...</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadAdminAuditList();
            // 每隔 3 秒自动轮询云端订单，实现跨设备全自动实时显示
            setInterval(loadAdminAuditList, 3000);
        };

        function loadAdminAuditList() {
            const container = document.getElementById('adminDepositAuditList');
            try {
                let orders = JSON.parse(localStorage.getItem('shared_cloud_orders')) || [];
                let pending = orders.filter(o => o.status === 'pending');

                document.getElementById('pendingCount').innerText = pending.length > 0 ? `(${pending.length})` : '';

                if (!pending || pending.length === 0) {
                    container.innerHTML = `<div class="text-xs text-gray-400 text-center py-6 bg-gray-50 rounded-xl border border-dashed">当前没有待审核的充值订单<br><span class="text-[10px] text-gray-300">（手机端提交后会自动显示在此处）</span></div>`;
                    return;
                }

                container.innerHTML = pending.map((item) => `
                    <div class="p-3 bg-gray-50 rounded-xl text-xs space-y-2 border border-gray-200 shadow-sm">
                        <div class="flex justify-between font-bold text-gray-700">
                            <span>UID: ${item.uid || '未知'}</span>
                            <span class="text-blue-600 font-bold text-sm">${item.amount} USDT</span>
                        </div>
                        <div class="text-[10px] text-gray-400">提交时间: ${item.time || '刚刚'}</div>
                        <div class="flex gap-2 pt-1">
                            <button type="button" onclick="approveOrder('${item.id}', '${item.uid}', ${item.amount})" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-xs font-bold transition active:scale-95">通过并加余额</button>
                            <button type="button" onclick="rejectOrder('${item.id}')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-xs font-bold transition active:scale-95">拒绝</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center py-4">读取订单异常</div>`;
            }
        }

        function addTestOrder() {
            let orders = JSON.parse(localStorage.getItem('shared_cloud_orders')) || [];
            orders.unshift({
                id: 'DEP' + Date.now().toString().slice(-6),
                uid: 'user_demo_001',
                amount: 100,
                status: 'pending',
                time: new Date().toLocaleString()
            });
            localStorage.setItem('shared_cloud_orders', JSON.stringify(orders));
            loadAdminAuditList();
            alert("已成功模拟添加一条测试订单！");
        }

        function approveOrder(orderId, uid, amount) {
            let orders = JSON.parse(localStorage.getItem('shared_cloud_orders')) || [];
            orders = orders.map(o => { if(o.id === orderId) o.status = 'success'; return o; });
            localStorage.setItem('shared_cloud_orders', JSON.stringify(orders));

            // 更新云端该用户的专属余额，前端会自动加钱
            let cloudBalances = JSON.parse(localStorage.getItem('shared_cloud_balances') || '{}');
            let currentBal = parseFloat(cloudBalances[uid]) || parseFloat(localStorage.getItem('balance_' + uid)) || 0;
            let newBal = currentBal + amount;
            
            cloudBalances[uid] = newBal;
            localStorage.setItem('shared_cloud_balances', JSON.stringify(cloudBalances));
            localStorage.setItem('balance_' + uid, newBal);

            alert(`已成功为用户 [${uid}] 确认到账并充值 ${amount} USDT！用户端将在 3 秒内自动增加余额。`);
            loadAdminAuditList();
        }

        function rejectOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('shared_cloud_orders')) || [];
            orders = orders.map(o => { if(o.id === orderId) o.status = 'rejected'; return o; });
            localStorage.setItem('shared_cloud_orders', JSON.stringify(orders));
            loadAdminAuditList();
            alert("已拒绝该笔充值申请");
        }

        function saveTargetUserBalance() {
            const uid = document.getElementById('adminTargetUser').value.trim();
            const bal = parseFloat(document.getElementById('adminTargetBalance').value);
            if (!uid || isNaN(bal)) { alert("请输入正确的 UID 和余额数字！"); return; }

            let cloudBalances = JSON.parse(localStorage.getItem('shared_cloud_balances') || '{}');
            cloudBalances[uid] = bal;
            localStorage.setItem('shared_cloud_balances', JSON.stringify(cloudBalances));
            localStorage.setItem('balance_' + uid, bal);

            alert(`已成功将用户 [${uid}] 余额修改为 ${bal.toFixed(2)} USDT！`);
        }
    </script>
</body>
</html>
