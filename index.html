<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赚钱项目-官方兑换商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-[#f4f6f9] text-[#1f2937] min-h-screen pb-20 select-none font-sans">
    <div class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl">💰</span>
            <span class="font-bold text-base text-gray-800">赚钱项目-官方兑换商城</span>
        </div>
        <span class="text-xs text-blue-600 bg-blue-50 px-3 py-1 rounded-full font-medium">Mini App</span>
    </div>

    <div class="max-w-2xl mx-auto p-4 sm:p-6 space-y-5">
        <div id="tab-shop" class="space-y-5">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs text-blue-100 font-medium">当前账户余额 (USDT)</span>
                    <span class="text-[10px] bg-white/20 text-white px-2.5 py-0.5 rounded-full font-medium">TRC20</span>
                </div>
                <div class="flex items-baseline space-x-1.5 mb-6">
                    <span class="text-4xl font-black" id="userBalanceDisplay">0.00</span>
                    <span class="text-sm text-blue-200">USDT</span>
                </div>
                <button type="button" id="btnDepositCard" class="w-full bg-white text-blue-600 font-bold py-3.5 rounded-xl text-sm shadow hover:bg-blue-50 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wallet"></i> 立即充值
                </button>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm space-y-5">
                <div class="font-bold text-gray-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-calculator text-blue-500"></i> 阶梯兑换计算器
                </div>
                <input type="number" id="inputAmount" placeholder="请输入兑换金额" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-lg font-bold focus:outline-none focus:border-blue-500" oninput="calculateRate()">
                <div class="bg-blue-50/65 border border-blue-100 p-4 rounded-xl flex items-center justify-between">
                    <div>
                        <div class="text-xs text-gray-500">阶梯汇率结算</div>
                        <div class="text-xs font-bold text-blue-600" id="currentRateDesc">单笔最低兑换 50 USDT</div>
                    </div>
                    <div class="text-right">
                        <span id="resultAmount" class="text-3xl font-black text-blue-600">0.00</span>
                        <span class="text-xs text-gray-500 ml-1">博彩U</span>
                    </div>
                </div>
                <button id="exchangeBtn" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl text-sm cursor-not-allowed">立即兑换</button>
            </div>
        </div>

        <div id="page-deposit" class="hidden space-y-4">
            <button type="button" onclick="switchPage('shop')" class="text-xs text-gray-600 flex items-center gap-1 font-medium bg-white px-3.5 py-2 rounded-xl border border-gray-200">
                <i class="fa-solid fa-chevron-left"></i> 返回商城
            </button>
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center space-y-5">
                <h3 class="font-bold text-xl text-gray-800">USDT 充值中心</h3>
                <p class="text-xs text-gray-400">当前 USDT 支付区块链网络协议为 TRC20</p>
                <div class="p-4 bg-gray-50 rounded-2xl border inline-block">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TPcyZeBmJoiaBeL7LzpZWW7hq1Hgzw75LQ" class="w-52 h-52 mx-auto rounded-lg">
                </div>
                <div class="bg-gray-50 p-3.5 rounded-xl border text-left">
                    <div class="text-xs text-gray-400 font-medium">TRC20 收款地址 (点击复制)：</div>
                    <div onclick="copyAddress('TPcyZeBmJoiaBeL7LzpZWW7hq1Hgzw75LQ')" class="text-xs font-mono font-bold text-gray-700 bg-white p-3 rounded-lg border cursor-pointer mt-1">
                        TPcyZeBmJoiaBeL7LzpZWW7hq1Hgzw75LQ
                    </div>
                </div>
                <button type="button" onclick="submitDepositNotify()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-sm shadow-md">我已充值</button>
                <div id="depositStatusBox" class="hidden text-left p-4 rounded-xl text-xs bg-yellow-50 border border-yellow-200 text-yellow-800"></div>
            </div>
        </div>
    </div>

    <script>
        const tiers = [
            { min: 50, max: 100, rate: 1.05 },
            { min: 100, max: 500, rate: 1.13 },
            { min: 500, max: 2000, rate: 1.38 },
            { min: 2000, max: 5000, rate: 1.42 },
            { min: 5000, max: 10000, rate: 1.45 }
        ];

        let currentUserId = "user_demo_001";
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            currentUserId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        } else {
            let localId = localStorage.getItem('tma_local_uid');
            if (!localId) { localId = 'UID_' + Math.random().toString(36).substring(2, 9); localStorage.setItem('tma_local_uid', localId); }
            currentUserId = localId;
        }

        let userBalance = parseFloat(localStorage.getItem('balance_' + currentUserId)) || 0.00;

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
            updateBalanceUI();
            document.getElementById('btnDepositCard').onclick = (e) => { e.stopPropagation(); switchPage('deposit'); };

            // 开启轮询：每隔 3 秒自动同步云端余额，实现后台审核加钱后前端秒级到账
            setInterval(syncUserBalanceFromServer, 3000);
        };

        function updateBalanceUI() {
            document.getElementById('userBalanceDisplay').innerText = userBalance.toFixed(2);
            localStorage.setItem('balance_' + currentUserId, userBalance);
        }

        async function syncUserBalanceFromServer() {
            try {
                let balances = JSON.parse(localStorage.getItem('global_user_balances') || '{}');
                if (balances[currentUserId] !== undefined && balances[currentUserId] !== userBalance) {
                    userBalance = parseFloat(balances[currentUserId]);
                    updateBalanceUI();
                }
            } catch(e){}
        }

        function switchPage(page) {
            document.getElementById('tab-shop').classList.add('hidden');
            document.getElementById('page-deposit').classList.add('hidden');
            if (page === 'deposit') document.getElementById('page-deposit').classList.remove('hidden');
            else document.getElementById('tab-shop').classList.remove('hidden');
        }

        function setAmount(val) {
            document.getElementById('inputAmount').value = val;
            calculateRate();
        }

        function calculateRate() {
            const inputEl = document.getElementById('inputAmount');
            if(!inputEl) return;
            const inputVal = parseFloat(inputEl.value);
            const resultEl = document.getElementById('resultAmount');
            const descEl = document.getElementById('currentRateDesc');
            const btnEl = document.getElementById('exchangeBtn');

            if (isNaN(inputVal) || inputVal < 50) {
                if(resultEl) resultEl.innerText = "0.00";
                if(descEl) descEl.innerText = "单笔最低兑换金额为 50";
                if(btnEl) { btnEl.disabled = true; btnEl.className = "w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl text-sm cursor-not-allowed"; }
                return;
            }

            let matchedTier = tiers.find(t => inputVal >= t.min && inputVal <= t.max) || tiers[tiers.length - 1];
            const calculated = (inputVal * matchedTier.rate).toFixed(2);
            if(resultEl) resultEl.innerText = calculated;
            if(descEl) descEl.innerText = `当前区间汇率: ${matchedTier.rate}`;
            if(btnEl) { btnEl.disabled = false; btnEl.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-sm shadow-md cursor-pointer"; }
        }

        function submitDepositNotify() {
            const inputVal = prompt("请输入您本次充值的 USDT 金额：", "100");
            if (!inputVal) return;
            const amount = parseFloat(inputVal);
            if (isNaN(amount) || amount <= 0) { alert("请输入有效金额"); return; }

            const newOrder = {
                id: 'DEP' + Date.now().toString().slice(-6),
                uid: currentUserId,
                amount: amount,
                status: 'pending',
                time: new Date().toLocaleString()
            };

            // 写入跨设备全局共享云存储通道
            let orders = JSON.parse(localStorage.getItem('global_network_orders')) || [];
            orders.unshift(newOrder);
            localStorage.setItem('global_network_orders', JSON.stringify(orders));

            alert("已成功提交充值通知！");
            const box = document.getElementById('depositStatusBox');
            box.classList.remove('hidden');
            box.innerHTML = "充值申请已提交（UID: " + currentUserId + "），正在等待管理员审核...";
        }

        function copyAddress(text) {
            navigator.clipboard.writeText(text).then(() => alert("钱包地址已复制！"));
        }
    </script>
</body>
</html>
