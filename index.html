<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赚钱项目-官方兑换商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { tgBg: '#f4f6f9', tgCardBg: '#ffffff', tgText: '#1f2937' }
                }
            }
        }
    </script>
    <style>.no-scrollbar::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-tgBg text-tgText min-h-screen pb-20 select-none font-sans">

    <!-- 顶部导航栏 -->
    <div class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl">💰</span>
            <span class="font-bold text-base text-gray-800">赚钱项目-官方兑换商城</span>
        </div>
        <span class="text-xs text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full font-medium">Mini App</span>
    </div>

    <!-- 主体内容区（限制最大宽度并居中，还原手机端精美排版） -->
    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- 兑换商城页面 -->
        <div id="tab-shop" class="space-y-4">
            
            <!-- 用户余额卡片 -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs text-blue-100 font-medium">当前账户余额 (USDT)</span>
                    <span class="text-[10px] bg-white/20 text-white px-2 py-0.5 rounded-full">TRC20</span>
                </div>
                <div class="flex items-baseline space-x-1 mb-4">
                    <span class="text-3xl font-black" id="userBalanceDisplay">0.00</span>
                    <span class="text-xs text-blue-200">USDT</span>
                </div>
                <div>
                    <button type="button" id="btnDepositCard" class="w-full bg-white text-blue-600 font-bold py-3 rounded-xl text-xs shadow hover:bg-blue-50 transition flex items-center justify-center gap-1.5 active:scale-98">
                        <i class="fa-solid fa-wallet text-sm"></i> 立即充值
                    </button>
                </div>
            </div>

            <!-- 兑换计算器卡片 -->
            <div id="exchangeCard" class="bg-tgCardBg p-5 rounded-2xl shadow-sm space-y-4">
                <div class="flex justify-between items-center text-sm">
                    <span class="font-semibold text-gray-800 flex items-center gap-1.5">
                        <i class="fa-solid fa-calculator text-blue-500"></i> 阶梯兑换计算器
                    </span>
                </div>
                <div class="relative">
                    <input type="number" id="inputAmount" placeholder="请输入兑换金额" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-lg font-bold focus:outline-none focus:border-blue-500 transition" oninput="calculateRate()">
                    <div class="absolute right-3 top-3.5 text-xs text-gray-400 font-semibold">USDT</div>
                </div>
                <div class="bg-blue-50/65 border border-blue-100 p-4 rounded-xl flex items-center justify-between">
                    <div>
                        <div class="text-xs text-gray-500 mb-0.5">阶梯汇率结算</div>
                        <div class="text-xs font-bold text-blue-600" id="currentRateDesc">单笔最低兑换 50 USDT</div>
                    </div>
                    <div class="text-right">
                        <span id="resultAmount" class="text-2xl font-black text-blue-600">0.00</span>
                        <span class="text-xs text-gray-500 ml-1">博彩U</span>
                    </div>
                </div>
                <button id="exchangeBtn" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-3.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed" onclick="submitExchange()">
                    <span>立即兑换</span>
                </button>
            </div>
        </div>

        <!-- 充值页面 -->
        <div id="page-deposit" class="hidden space-y-4">
            <button type="button" onclick="switchPage('shop')" class="text-xs text-gray-600 flex items-center gap-1 font-medium bg-white px-3 py-1.5 rounded-lg border border-gray-200">
                <i class="fa-solid fa-chevron-left"></i> 返回商城
            </button>
            <div class="bg-tgCardBg p-5 rounded-2xl shadow-sm text-center space-y-4">
                <h3 class="font-bold text-lg text-gray-800">USDT 充值中心</h3>
                <p class="text-xs text-gray-400">当前 USDT 支付区块链网络协议为 TRC20</p>
                <div class="p-4 bg-gray-50 rounded-2xl border inline-block">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TPcyZeBmJoiaBeL7LzpZWW7hq1Hgzw75LQ" class="w-48 h-48 mx-auto rounded-lg shadow-sm">
                </div>
                <div class="bg-gray-50 p-3 rounded-xl border text-left">
                    <div class="text-xs text-gray-400">TRC20 收款地址 (点击可复制)：</div>
                    <div onclick="copyAddress('TPcyZeBmJoiaBeL7LzpZWW7hq1Hgzw75LQ')" class="text-xs font-mono font-bold text-gray-700 bg-white p-2.5 rounded-lg border mt-1 cursor-pointer">
                        TPcyZeBmJoiaBeL7LzpZWW7hq1Hgzw75LQ
                    </div>
                </div>
                <button type="button" onclick="submitDepositNotify()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md transition">
                    我已充值
                </button>
                <div id="depositStatusBox" class="hidden text-left p-4 rounded-xl text-xs bg-yellow-50 border border-yellow-200 text-yellow-800"></div>
            </div>
        </div>

    </div>

    <script>
        let currentUserId = "user_demo_001";
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            currentUserId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        } else {
            let localId = localStorage.getItem('tma_local_uid');
            if (!localId) { localId = 'UID_' + Math.random().toString(36).substring(2, 9); localStorage.setItem('tma_local_uid', localId); }
            currentUserId = localId;
        }

        let userBalance = parseFloat(localStorage.getItem('balance_' + currentUserId)) || 0.00;

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
            updateBalanceUI();
            document.getElementById('btnDepositCard').onclick = (e) => { e.stopPropagation(); switchPage('deposit'); };
        };

        function updateBalanceUI() {
            document.getElementById('userBalanceDisplay').innerText = userBalance.toFixed(2);
            localStorage.setItem('balance_' + currentUserId, userBalance);
        }

        function switchPage(page) {
            document.getElementById('tab-shop').classList.add('hidden');
            document.getElementById('page-deposit').classList.add('hidden');
            if (page === 'deposit') document.getElementById('page-deposit').classList.remove('hidden');
            else document.getElementById('tab-shop').classList.remove('hidden');
        }

        function submitDepositNotify() {
            const inputVal = prompt("请输入您本次充值的 USDT 金额：", "100");
            if (!inputVal) return;
            const amount = parseFloat(inputVal);
            if (isNaN(amount) || amount <= 0) { alert("请输入有效金额"); return; }

            let orders = JSON.parse(localStorage.getItem('global_deposit_orders')) || [];
            orders.unshift({
                id: 'DEP' + Date.now().toString().slice(-6),
                uid: currentUserId,
                amount: amount,
                status: 'pending',
                time: new Date().toLocaleString()
            });
            localStorage.setItem('global_deposit_orders', JSON.stringify(orders));

            alert("已成功提交充值通知，请联系管理员审核！");
            const box = document.getElementById('depositStatusBox');
            box.classList.remove('hidden');
            box.innerHTML = "充值申请已提交，正在等待管理员审核...";
        }

        function copyAddress(text) {
            navigator.clipboard.writeText(text).then(() => alert("钱包地址已复制！"));
        }
    </script>
</body>
</html>
