<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赚钱项目-官方兑换商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { tgBg: '#f4f6f9', tgCardBg: '#ffffff', tgText: '#1f2937' }
                }
            }
        }
    </script>
    <style>.no-scrollbar::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-tgBg text-tgText min-h-screen pb-24 select-none font-sans">

    <!-- 顶部导航栏 -->
    <div class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl">💰</span>
            <span class="font-bold text-base text-gray-800">赚钱项目-官方兑换商城</span>
        </div>
        <span class="text-xs text-blue-600 bg-blue-50 px-3 py-1 rounded-full font-medium">Mini App</span>
    </div>

    <!-- 主体内容区 -->
    <div class="max-w-2xl mx-auto p-4 sm:p-6 space-y-5">
        
        <!-- 1. 兑换商城首页 -->
        <div id="tab-shop" class="space-y-5">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs text-blue-100 font-medium">当前账户余额 (USDT)</span>
                    <span class="text-[10px] bg-white/20 text-white px-2.5 py-0.5 rounded-full font-medium">TRC20</span>
                </div>
                <div class="flex items-baseline space-x-1.5 mb-6">
                    <span class="text-4xl font-black" id="userBalanceDisplay">0.00</span>
                    <span class="text-sm text-blue-200">USDT</span>
                </div>
                <div>
                    <button type="button" id="btnDepositCard" class="w-full bg-white text-blue-600 font-bold py-3.5 rounded-xl text-sm shadow hover:bg-blue-50 transition flex items-center justify-center gap-2 active:scale-98">
                        <i class="fa-solid fa-wallet"></i> 立即充值
                    </button>
                </div>
            </div>

            <!-- 兑换计算器卡片 -->
            <div id="exchangeCard" class="bg-tgCardBg p-6 rounded-2xl shadow-sm space-y-5">
                <div class="flex justify-between items-center text-sm">
                    <span class="font-bold text-gray-800 flex items-center gap-2 text-base">
                        <i class="fa-solid fa-calculator text-blue-500"></i> 阶梯兑换计算器
                    </span>
                </div>
                <div class="relative">
                    <input type="number" id="inputAmount" placeholder="请输入兑换金额" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-lg font-bold focus:outline-none focus:border-blue-500 transition" oninput="calculateRate()">
                    <div class="absolute right-4 top-4 text-xs text-gray-400 font-semibold">USDT</div>
                </div>

                <!-- 快捷金额按钮 -->
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                    <button type="button" onclick="setAmount(50)" class="bg-gray-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0">50</button>
                    <button type="button" onclick="setAmount(100)" class="bg-gray-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0">100</button>
                    <button type="button" onclick="setAmount(500)" class="bg-gray-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0">500</button>
                    <button type="button" onclick="setAmount(1000)" class="bg-gray-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0">1000</button>
                    <button type="button" onclick="setAmount(2000)" class="bg-gray-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0">2000</button>
                    <button type="button" onclick="setAmount(5000)" class="bg-gray-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0">5000</button>
                </div>

                <div class="bg-blue-50/65 border border-blue-100 p-4 rounded-xl flex items-center justify-between">
                    <div>
                        <div class="text-xs text-gray-500 mb-0.5">阶梯汇率结算</div>
                        <div class="text-xs font-bold text-blue-600" id="currentRateDesc">单笔最低兑换 50 USDT</div>
                    </div>
                    <div class="text-right">
                        <span id="resultAmount" class="text-3xl font-black text-blue-600">0.00</span>
                        <span class="text-xs text-gray-500 ml-1">博彩U</span>
                    </div>
                </div>
                <button id="exchangeBtn" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed text-sm" onclick="submitExchange()">
                    <span>立即兑换</span>
                </button>
            </div>

            <!-- 阶梯汇率表 -->
            <div class="bg-tgCardBg p-6 rounded-2xl shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-sm text-gray-800">阶梯汇率表</span>
                    <span class="text-xs text-gray-400">实时生效中</span>
                </div>
                <div class="grid grid-cols-3 text-center text-xs font-semibold text-gray-400 pb-1 border-b border-gray-100">
                    <div>最低金额</div>
                    <div>最高金额</div>
                    <div>区间汇率</div>
                </div>
                <div class="space-y-2" id="tierList">
                    <div class="tier-row grid grid-cols-3 text-center py-2.5 rounded-xl bg-gray-50 text-xs items-center transition"><div class="font-bold text-gray-700">50</div><div class="text-gray-400">100</div><div class="font-bold text-blue-600 text-sm">1.05</div></div>
                    <div class="tier-row grid grid-cols-3 text-center py-2.5 rounded-xl bg-gray-50 text-xs items-center transition"><div class="font-bold text-gray-700">100</div><div class="text-gray-400">500</div><div class="font-bold text-blue-600 text-sm">1.13</div></div>
                    <div class="tier-row grid grid-cols-3 text-center py-2.5 rounded-xl bg-gray-50 text-xs items-center transition"><div class="font-bold text-gray-700">500</div><div class="text-gray-400">2000</div><div class="font-bold text-blue-600 text-sm">1.38</div></div>
                    <div class="tier-row grid grid-cols-3 text-center py-2.5 rounded-xl bg-gray-50 text-xs items-center transition"><div class="font-bold text-gray-700">2000</div><div class="text-gray-400">500
